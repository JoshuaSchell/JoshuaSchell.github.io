[package]
name = "site"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
maud = "0.27"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
pulldown-latex = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "html", "regex-fancy"] }
toml = "1"

[profile.release]
debug = false
